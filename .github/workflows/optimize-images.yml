name: Optimize website images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-images.yml"
      - "scripts/optimize-images.py"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image optimizer
        run: python -m pip install --upgrade Pillow
      - name: Convert and update image references
        run: python scripts/optimize-images.py
      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No image changes required."
          else
            git commit -m "Optimize website images and update asset references"
            git push origin HEAD:main
          fi
